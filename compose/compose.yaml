x-tcpdump: &base_dump
  image: alpine:latest
  command: >
    sh -c "apk add --no-cache tcpdump &&
      tcpdump -i any -w /captures/$${PREFIX}traffic_$$(date +%s).pcap"
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN
    - NET_RAW
  volumes:
    - /tmp/logs/tcpdump:/captures
  restart: unless-stopped
  network_mode: "service:tbd"

services:
  falco:
    image: docker.io/falcosecurity/falco:latest
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
    volumes:
      - /proc:/host/proc:ro,rslave
      - /etc:/host/etc:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./rules.d:/etc/falco/rules.d:ro
      - ./falco.yaml:/etc/falco/falco.yaml:ro
      - /tmp/logs/falco:/var/log/falco
    restart: unless-stopped

  vulnerable-php:
    image: php:8.5.11-apache
    ports:
      - 0.0.0.0:80:80
    volumes:
      - ../app:/var/www/html
    restart: unless-stopped
    networks:
      - vulnerable-php

  tcpdump-php:
    <<: *base_dump
    network_mode: service:vulnerable-php
    environment:
      PREFIX: php_

  vulnerable-node:
    build:
      context: ../node2shell
    ports:
      - 0.0.0.0:8080:8080
    restart: unless-stopped
    networks:
      - vulnerable-node

  tcpdump-node:
    <<: *base_dump
    network_mode: service:vulnerable-node
    environment:
      PREFIX: node_

networks:
  vulnerable-php:
    driver: bridge
  vulnerable-node:
    driver: bridge
